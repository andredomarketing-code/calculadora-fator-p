<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jogo da memória Fator P PREMIX.">
  <title>Jogo da Memória Fator P | PREMIX</title>
  <link rel="stylesheet" href="assets/totem.css">
  <style>
    :root{--blue:#08285f;--blue-2:#123f7b;--lime:#b6cd22;--orange:#f25328;--paper:#f8fafc;--ink:#14284a;--line:#d9e1e8}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Gotham,"Gotham Rounded",Montserrat,Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input{font:inherit}.game-shell{position:relative;isolation:isolate;height:100svh;min-height:0;display:grid;grid-template-rows:32svh 76px minmax(0,1fr) 122px;overflow:hidden;background:linear-gradient(rgba(248,250,252,.82),rgba(248,250,252,.82)),url("assets/creative-abstract-background-wallpaper.jpg") center/cover no-repeat}.hero{position:relative;z-index:1;min-height:0;padding:clamp(48px,6vh,105px) clamp(48px,8vw,145px) clamp(34px,4vh,62px);overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.94),rgba(255,255,255,.8))}.hero-content{position:relative;max-width:900px;margin:auto;padding-right:160px}.premix{width:175px;height:auto;margin-bottom:clamp(28px,3.2vh,54px)}.hero h1{margin:0;color:#101010;font-size:clamp(38px,4.3vw,70px);line-height:1.02;letter-spacing:-.045em;font-weight:800}.hero h1 span{display:block;margin-top:18px}.hero h1 b{color:var(--blue)}.hero p{max-width:750px;margin:26px 0 0;font-size:clamp(22px,2.25vw,34px);line-height:1.25;font-weight:500}.hero p strong{font-weight:800}.rules{display:block;max-width:750px;margin-top:16px;color:#52637b;font-size:clamp(14px,1.35vw,19px);line-height:1.3}.fator-p{position:absolute;right:0;bottom:0;width:125px;max-height:230px;object-fit:contain}.moves{display:flex;align-items:center;justify-content:center;background:rgba(214,214,214,.94);color:#111;font-size:clamp(25px,2.2vw,36px);font-weight:800}.moves strong{display:inline-block;min-width:1.2em;text-align:center}.board-area{display:grid;place-items:center;min-height:0;padding:clamp(30px,4vh,66px) clamp(34px,7vw,115px)}.board{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:clamp(14px,2vw,30px);width:min(880px,100%)}.memory-card{aspect-ratio: .67;border:0;padding:0;perspective:900px;cursor:pointer;background:transparent;touch-action:manipulation}.memory-card:disabled{cursor:default}.card-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s ease}.memory-card.flipped .card-inner,.memory-card.matched .card-inner{transform:rotateY(180deg)}.card-back,.card-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:15px;backface-visibility:hidden;-webkit-backface-visibility:hidden}.card-back{overflow:hidden;background:var(--blue);box-shadow:0 10px 17px rgba(8,40,95,.2)}.card-back:after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.26);border-radius:10px}.card-back img{position:relative;z-index:1;width:78%;height:78%;object-fit:contain}.card-face{transform:rotateY(180deg);border:4px solid var(--blue);background:#fff;color:var(--blue);font-size:clamp(76px,10vw,142px);font-weight:800;line-height:1;box-shadow:0 10px 17px rgba(8,40,95,.13)}.memory-card.matched .card-face{border-color:var(--lime);background:#f8fce5}.footer{display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(237,243,248,.9),rgba(255,255,255,.9))}.footer-cta{padding:14px 32px;background:#e2e2e2;color:#111;text-decoration:none;font-size:clamp(18px,1.8vw,28px);font-weight:800}.modal{position:absolute;z-index:10;inset:0;display:none;place-items:center;padding:40px;background:rgba(4,22,57,.78);backdrop-filter:blur(5px)}.modal.visible{display:grid}.modal-card{width:min(760px,100%);padding:clamp(36px,5vw,70px);background:#fff;box-shadow:0 25px 70px rgba(0,0,0,.25);text-align:center}.modal-card h2{margin:0;color:var(--blue);font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.04em}.modal-card p{margin:20px 0 0;font-size:clamp(18px,2vw,27px);line-height:1.35}.modal-card form{display:grid;gap:18px;margin-top:32px;text-align:left}.modal-card label{display:grid;gap:8px;color:var(--blue);font-size:15px;font-weight:800}.modal-card input{height:64px;border:2px solid #b7c4d5;padding:0 16px;color:var(--ink);font-size:19px;outline:0}.modal-card input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,40,95,.12)}.modal-card button{min-height:66px;border:0;background:var(--orange);color:#fff;cursor:pointer;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.prize-number{display:block;margin:26px auto 0;color:var(--lime);font-size:clamp(92px,13vw,175px);line-height:.82;font-weight:800}.countdown{min-height:1.5em;margin-top:28px!important;color:#60718a;font-size:16px!important}.lost h2{color:#fff}.lost{background:var(--blue);color:#fff}.lost .countdown{color:#dce8f7}@media(max-width:760px){html,body{overflow:hidden}.game-shell{height:100svh;grid-template-rows:30svh 62px minmax(0,1fr) 94px}.hero{padding:35px 28px}.hero-content{padding-right:65px}.premix{width:125px;margin-bottom:25px}.hero h1{font-size:37px}.hero h1 span{margin-top:10px}.hero p{margin-top:18px;font-size:19px}.rules{margin-top:10px;font-size:13px}.fator-p{width:65px;max-height:115px}.moves{font-size:22px}.board-area{padding:34px 22px}.board{gap:10px}.card-back,.card-face{border-radius:9px}.card-face{border-width:2px;font-size:48px}.footer-cta{font-size:17px}.modal{position:fixed;padding:20px}.modal-card{padding:32px 25px}.modal-card input{height:56px}}
  </style>
  <style>
    :root{--blue:#002d6b;--blue-2:#164b8d;--lime:#b5cf22;--orange:#f04f26;--paper:#f4f7fa}
    .game-shell{background:linear-gradient(rgba(244,247,250,.74),rgba(244,247,250,.88)),url("assets/creative-abstract-background-wallpaper.jpg") center/cover no-repeat}
    .hero{background:linear-gradient(118deg,rgba(0,31,82,.98),rgba(0,68,145,.9)),url("assets/creative-abstract-background-wallpaper.jpg") center/cover no-repeat}
    .premix{filter:none}.hero h1{color:#fff}.hero h1 b{color:var(--lime)}.hero p{color:#e4edfa}.rules{color:#dce7f7}.rules:before{content:"";display:inline-block;width:8px;height:8px;margin:0 8px 1px 0;background:var(--lime);border-radius:50%}
    .moves{background:var(--lime);color:var(--blue);box-shadow:0 4px 12px rgba(0,31,82,.16)}.moves strong{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
    .board{grid-template-columns:repeat(4,minmax(100px,1fr));gap:clamp(12px,1.5vw,22px);width:min(720px,100%)}.memory-card{aspect-ratio:.72}.card-back{background:linear-gradient(145deg,#00245c,#06448d);box-shadow:0 14px 24px rgba(0,34,92,.23)}.card-back:after{border-color:rgba(181,207,34,.8)}.card-face{border-color:var(--blue);box-shadow:0 12px 24px rgba(0,34,92,.16)}.memory-card.matched .card-face{border-color:var(--lime);background:#f7fce3;color:var(--blue)}
    .footer{background:linear-gradient(90deg,#00245c,#06448d,#00245c)}.footer-cta{background:var(--orange);color:#fff;box-shadow:0 8px 16px rgba(0,0,0,.18)}
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hero">
      <div class="hero-content"><img class="premix" src="assets/Logotipo_Premix_Negativo.png" alt="PREMIX"><h1>Jogo da memória <b>Fator&nbsp;P</b><span>O café é por nossa conta,</span></h1><p>mas acertando todas as combinações em <strong>10 jogadas</strong>, você ganha um café especial.</p><small class="rules">Regra: cada tentativa usa uma jogada. Ao acertar um par, você ganha uma jogada extra.</small><img class="fator-p" src="assets/logo-fator-p-premix.png" alt="Tecnologia Fator P"></div>
    </section>
    <div class="moves"><strong id="moves-count">10</strong>&nbsp;jogadas restantes</div>
    <section class="board-area" aria-label="Cartas do jogo da memória"><div id="board" class="board"></div></section>
    <footer class="footer"><a class="footer-cta" href="captura.html">CALCULAR DESEMPENHO FATOR P</a></footer>
    <section id="modal" class="modal" aria-live="polite"><div id="modal-card" class="modal-card"></div></section>
  </main>
  <script>
    const pairs=['A','B','C','D','E','F','G','H'];let firstCard=null,lockBoard=false,moves=10,matches=0,resetTimer;
    const board=document.getElementById('board'),movesCount=document.getElementById('moves-count'),modal=document.getElementById('modal'),modalCard=document.getElementById('modal-card');
    const shuffle=list=>[...list].sort(()=>Math.random()-.5);
    function startGame(){clearTimeout(resetTimer);firstCard=null;lockBoard=false;moves=10;matches=0;movesCount.textContent=moves;modal.classList.remove('visible');board.innerHTML='';shuffle([...pairs,...pairs]).forEach(letter=>{const card=document.createElement('button');card.className='memory-card';card.type='button';card.dataset.letter=letter;card.setAttribute('aria-label','Carta do jogo da memória');card.innerHTML=`<span class="card-inner"><span class="card-back"><img src="assets/logo-fator-p-premix.png" alt=""></span><span class="card-face">${letter}</span></span>`;card.addEventListener('click',flipCard);board.append(card)})}
    function flipCard(){if(lockBoard||this===firstCard||this.classList.contains('matched'))return;this.classList.add('flipped');if(!firstCard){firstCard=this;return}lockBoard=true;moves--;movesCount.textContent=moves;const secondCard=this,isMatch=firstCard.dataset.letter===secondCard.dataset.letter;if(isMatch){firstCard.classList.add('matched');secondCard.classList.add('matched');matches++;setTimeout(()=>{moves++;movesCount.textContent=moves;firstCard=null;lockBoard=false;if(matches===pairs.length)showWin()},350);return}setTimeout(()=>{firstCard.classList.remove('flipped');secondCard.classList.remove('flipped');firstCard=null;lockBoard=false;if(moves===0)showLoss()},700)}
    function showWin(){modalCard.className='modal-card';modalCard.innerHTML='<h2>Você ganhou!</h2><p>Preencha seus dados para resgatar seu café especial.</p><form id="reward-form"><label>Seu nome<input name="name" type="text" autocomplete="name" required></label><label>Seu celular<input id="reward-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required></label><label>Seu e-mail<input name="email" type="email" autocomplete="email" inputmode="email" required></label><button class="touch-cta" type="submit">Confirmar dados</button></form>';modal.classList.add('visible');const phone=document.getElementById('reward-phone');phone.addEventListener('input',()=>{const digits=phone.value.replace(/\D/g,'').slice(0,11);phone.value=digits.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2')});document.getElementById('reward-form').addEventListener('submit',event=>{event.preventDefault();if(phone.value.replace(/\D/g,'').length<10){phone.focus();return}showPrize()})}
    function showPrize(){modalCard.className='modal-card';modalCard.innerHTML='<h2>Você ganhou!</h2><p>Seu café especial poderá ser retirado no balcão.</p><p class="countdown">Esta tela reinicia em <b id="countdown">3</b> segundos</p>';beginCountdown()}
    function showLoss(){modalCard.className='modal-card lost';modalCard.innerHTML='<h2>Infelizmente você não ganhou.<br>Tente novamente.</h2><p class="countdown">Uma nova partida começa em <b id="countdown">3</b> segundos</p>';modal.classList.add('visible');beginCountdown()}
    function beginCountdown(){let seconds=3;const countdown=document.getElementById('countdown');const interval=setInterval(()=>{seconds--;if(seconds>0)countdown.textContent=seconds;else clearInterval(interval)},1000);resetTimer=setTimeout(startGame,3000)}
    let inactivityTimer;const resetInactivity=()=>{clearTimeout(inactivityTimer);inactivityTimer=setTimeout(()=>location.href='captura.html',60000)};['pointerdown','keydown','input','change'].forEach(event=>document.addEventListener(event,resetInactivity,{passive:true}));resetInactivity();startGame();
  </script>
</body>
</html>
