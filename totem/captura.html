<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cadastre-se para acessar a Calculadora Fator P PREMIX.">
  <title>Fator P | PREMIX</title>
  <link rel="stylesheet" href="assets/totem.css">
  <style>
    :root{--blue:#002e70;--lime:#b4cc22;--orange:#f05427;--line:#dbe3ec;--ink:#1e3861}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--blue);color:var(--ink);font-family:Gotham,"Gotham Rounded",Montserrat,Arial,sans-serif}.page{min-height:100svh;display:grid;grid-template-rows:1fr auto auto;background:var(--blue)}.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(190px,22vw) 1fr;gap:clamp(34px,5vw,92px);align-items:center;min-height:52svh;padding:clamp(35px,5vw,76px) clamp(48px,9vw,150px);overflow:hidden;background:linear-gradient(118deg,rgba(0,29,80,.97),rgba(0,64,149,.91))}.hero:before{content:"";position:absolute;z-index:-2;inset:0;background:url("assets/creative-abstract-background-wallpaper.jpg") center/cover no-repeat;opacity:.24;mix-blend-mode:screen}.hero:after{content:"";position:absolute;z-index:-1;right:-8vw;bottom:-21vw;width:46vw;height:46vw;border:1px solid rgba(180,204,34,.56);transform:rotate(45deg);pointer-events:none}.fator-logo{position:relative;z-index:1;justify-self:center;width:min(190px,15vw);min-width:135px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,15,53,.3))}.copy{position:relative;z-index:1;max-width:850px}.copy h1{margin:0;color:#fff;font-size:clamp(38px,4.55vw,76px);line-height:1.04;letter-spacing:-.055em;font-weight:800}.marker{display:table;position:relative;margin:0 0 10px;padding:0 15px 5px;color:var(--blue);isolation:isolate}.marker:before{content:"";position:absolute;z-index:-1;inset:7% -1.5% 0;background:var(--lime);transform:skewX(-8deg)}.copy p{margin:22px 0 0;color:#e0eafa;font-size:clamp(18px,1.45vw,25px);font-weight:500;line-height:1.35}.capture{padding:clamp(28px,3vw,46px) clamp(48px,9vw,150px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.capture form{display:grid;grid-template-columns:1.1fr 1fr 1.1fr auto;gap:clamp(15px,2vw,30px);align-items:end;max-width:1460px;margin:auto}.field label{display:block;margin:0 0 8px;color:var(--blue);font-size:14px;font-weight:800}.field input{width:100%;height:65px;border:2px solid #b6c3d2;border-radius:0;padding:0 18px;background:#fff;color:var(--ink);outline:0;font:500 19px Gotham,"Gotham Rounded",Montserrat,Arial,sans-serif}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,46,112,.12)}.field input[aria-invalid="true"]{border-color:#c13d2a}.button{min-width:196px;height:65px;border:0;border-radius:0;padding:0 26px;background:var(--orange);color:#fff;cursor:pointer;font:800 16px Gotham,"Gotham Rounded",Montserrat,Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;transition:background .18s,transform .18s}.button:hover{background:#d9451c}.button:active{transform:scale(.985)}.button:disabled{background:#5d779b;cursor:wait}.message{display:none;max-width:1460px;margin:18px auto 0;padding:13px 15px;border-left:4px solid var(--lime);background:#edf5e6;color:#284724;font-weight:700}.message.show{display:block}.footer{display:flex;align-items:center;justify-content:center;min-height:16svh;padding:27px;background:linear-gradient(90deg,#00275f,#00418e,#00275f)}.footer img{width:min(220px,23vw);height:auto}@media(max-width:900px){.hero{grid-template-columns:135px 1fr;padding:55px 42px;min-height:43svh}.fator-logo{width:130px;min-width:0}.capture{padding:32px 42px}.capture form{grid-template-columns:1fr 1fr}.button{width:100%}.footer{min-height:12svh}}@media(max-width:570px){.hero{grid-template-columns:1fr;gap:23px;padding:38px 25px}.fator-logo{justify-self:start;width:104px}.copy h1{font-size:41px}.copy p{font-size:18px}.capture{padding:28px 25px}.capture form{grid-template-columns:1fr;gap:17px}.field input,.button{height:62px}.footer img{width:155px}}@media(orientation:portrait) and (min-width:761px){.page{grid-template-rows:auto auto auto;min-height:100svh}.hero{grid-template-columns:1fr;gap:28px;min-height:0;padding:80px 70px 64px;text-align:center}.fator-logo{width:142px;min-width:0}.copy{max-width:820px;margin:auto}.copy h1{font-size:58px}.marker{margin-left:auto;margin-right:auto}.copy p{max-width:710px;margin:26px auto 0;font-size:23px}.capture{padding:56px 70px}.capture form{grid-template-columns:1fr;gap:25px;max-width:820px}.field label{text-align:left;font-size:17px}.field input,.button{height:78px;font-size:22px}.button{margin-top:8px}.footer{min-height:170px}.footer img{width:240px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="headline">
      <img class="fator-logo" src="assets/logo-fator-p-premix.png" alt="Tecnologia Fator P">
      <div class="copy"><h1 id="headline"><span class="marker">Desempenho e saúde</span><span class="marker">para o seu rebanho.</span></h1><p>Veja como a tecnologia Fator P pode trazer mais produtividade, rentabilidade e sustentabilidade para a sua pecuária.</p></div>
    </section>
    <section class="capture" aria-label="Cadastro para simulação">
      <form id="lead-form" novalidate>
        <div class="field"><label for="nome">Seu nome</label><input id="nome" name="nome" type="text" autocomplete="name" required></div>
        <div class="field"><label for="celular">Seu celular</label><input id="celular" name="celular" type="tel" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required></div>
        <div class="field"><label for="email">Seu e-mail</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
        <button class="button" type="submit">Calcular desempenho <span aria-hidden="true">→</span></button>
        <a class="secondary-cta" href="jogo-memoria.html">Jogar e ganhar um café especial</a>
      </form>
      <div id="message" class="message" role="status" aria-live="polite">Dados recebidos. Abrindo sua calculadora...</div>
    </section>
    <footer class="footer"><img src="assets/Logotipo_Premix_Negativo.png" alt="PREMIX"></footer>
  </main>
  <script>
    const form=document.getElementById('lead-form');const fields=[...form.querySelectorAll('input[required]')];const phone=document.getElementById('celular');
    phone.addEventListener('input',()=>{const digits=phone.value.replace(/\D/g,'').slice(0,11);phone.value=digits.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2')});
    form.addEventListener('submit',event=>{event.preventDefault();let valid=true;fields.forEach(field=>{const isValid=field.checkValidity()&&(field!==phone||phone.value.replace(/\D/g,'').length>=10);field.setAttribute('aria-invalid',String(!isValid));if(!isValid)valid=false});if(!valid){fields.find(field=>field.getAttribute('aria-invalid')==='true').focus();return}const button=form.querySelector('button');button.disabled=true;button.textContent='Preparando...';document.getElementById('message').classList.add('show');setTimeout(()=>window.location.href='index.html',1000)});
    let idleTimer;const resetIdle=()=>{clearTimeout(idleTimer);idleTimer=setTimeout(()=>location.reload(),60000)};['pointerdown','keydown','input','change'].forEach(event=>document.addEventListener(event,resetIdle,{passive:true}));resetIdle();
  </script>
</body>
</html>
